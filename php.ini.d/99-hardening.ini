; php.ini.d/99-hardening.ini — PHP hardening baseline
;
; Deploy targets:
;   Termux:   $PREFIX/etc/php/php.ini.d/99-hardening.ini
;   Debian:   /etc/php/8.x/fpm/conf.d/99-hardening.ini
;   RHEL:     /etc/php.d/99-hardening.ini
;   Docker:   COPY into /usr/local/etc/php/conf.d/
;
; 99- prefix ensures lexical ordering wins over distro defaults.
; Values here are compiled defaults on PHP 8.2–8.5 unless noted.

; --- Error handling ------------------------------------------------------
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
; Adjust path per deployment. Termux: ${PREFIX}/var/log/php_errors.log
; Debian: /var/log/php/error.log | Docker: /proc/self/fd/2 (stderr)
error_log = /data/data/com.termux/files/usr/var/log/php_errors.log

; --- Remote code inclusion -----------------------------------------------
allow_url_include = Off
; allow_url_fopen is context-dependent; Off unless your app needs HTTP streams
allow_url_fopen = Off

; --- Session hardening ---------------------------------------------------
session.cookie_httponly = On
; cookie_secure=On BREAKS plain-HTTP dev. Uncomment only behind HTTPS.
; session.cookie_secure = On
session.use_strict_mode = On
session.use_only_cookies = On
session.use_trans_sid = Off
session.sid_length = 48
session.sid_bits_per_character = 6
; CVE-2026-109618/109619 mitigation — blocks the known UAF trigger
session.upload_progress.enabled = Off

; --- Execution limits ----------------------------------------------------
memory_limit = 128M
max_execution_time = 30
max_input_time = 30
max_input_vars = 1000

; --- Dangerous function blocklist ----------------------------------------
; Audit greps for the first 6. Add more cautiously — some apps break.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,phpinfo,show_source
; Note: eval, assert, create_function CANNOT be disabled this way.
; Note: ini_set() can re-enable these at runtime unless overridden by
;       php_admin_value[disable_functions] in the FPM pool.

; --- Filesystem (context-dependent) --------------------------------------
; Restrict file access to your app root. Enable per-deployment:
; open_basedir = /var/www/html:/tmp

; --- PHP 8.5 only (ignored on older versions) ----------------------------
fatal_error_backtraces = Off