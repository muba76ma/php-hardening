# nginx/php-hardening.conf -- nginx server-block hardening for PHP apps
#
# Deploy targets:
#   Termux:  $PREFIX/etc/nginx/conf.d/php-hardening.conf  (via include in nginx.conf)
#   Debian:  /etc/nginx/sites-available/php-hardening.conf (+ symlink to sites-enabled)
#   Docker:  /etc/nginx/conf.d/default.conf
#
# Usage:
#   A) New deployment -- use this file as-is (full server block).
#   B) Existing deployment -- copy individual directive groups into your
#      server{} block. Each section is delimited by "# --- name ---" markers.
#
# Validate locally:
#   test_conf="$(mktemp)"
#   cat > "$test_conf" <<WRAP_END
#   events { worker_connections 64; }
#   http { include $PWD/nginx/php-hardening.conf; }
#   WRAP_END
#   nginx -t -c "$test_conf"; rm -f "$test_conf"
#
# Rate limiting note: uncomment both the limit_req_zone in http{} context
# (NOT inside server{}) and the limit_req directives below.

server {
    listen 127.0.0.1:8080;
    # Debian/Docker: listen 80; listen [::]:80;

    server_name _;

    # CHANGE THIS to your app's document root
    root /data/data/com.termux/files/usr/share/nginx/html;
    # Debian/Docker: root /var/www/html;

    index index.php index.html;

    # --- server tokens -------------------------------------------------------
    server_tokens off;

    # --- request body / header limits ----------------------------------------
    client_max_body_size    8m;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout    12s;
    client_header_timeout  12s;
    send_timeout           10s;

    # --- security headers ----------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    # HSTS -- enable only when serving over HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP -- adjust to your app before enabling:
    # add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'self'" always;

    # --- PHP handler ---------------------------------------------------------
    location ~ \.php$ {
        # Reject requests for non-existent PHP files (path-info tricks)
        try_files $uri =404;

        # Single socket only -- prevents SSRF to arbitrary fastcgi backends
        fastcgi_pass unix:/data/data/com.termux/files/usr/var/run/php-fpm.sock;
        # Debian: fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        # Docker: fastcgi_pass 127.0.0.1:9000;

        fastcgi_index index.php;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param HTTP_PROXY      "";

        # --- timeouts (mirror fpm pool) ---
        fastcgi_read_timeout    60s;
        fastcgi_send_timeout    60s;
        fastcgi_connect_timeout 5s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 32k;

        # Rate limiting -- uncomment after defining zone in http{}:
        # limit_req  zone=php_req burst=20 nodelay;
        # limit_conn php_conn 20;
    }

    # --- deny hidden files ---------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # --- deny backup / swap / source / archive extensions --------------------
    location ~* \.(bak|backup|old|orig|swp|swo|tmp|log|sql|sqlite|db|env|git|svn|hg|htaccess|htpasswd|ini|conf|sh|bash)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # --- deny VCS and dependency directories ---------------------------------
    location ~* /(vendor|node_modules|\.git|\.svn|\.hg)/ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # --- deny common tooling / config leaks ----------------------------------
    location ~* /(wp-config\.php|composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|Dockerfile|docker-compose\.ya?ml|Makefile|phpunit\.xml|\.env(\..+)?)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # --- deny PHP execution in uploads (uncomment when applicable) -----------
    # location ~* ^/uploads/.*\.(php[0-9]?|phtml|phar)$ {
    #     deny all;
    #     return 403;
    # }

    # --- static assets -------------------------------------------------------
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|ico|woff2?|ttf|eot|mp4|webm|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- method restriction --------------------------------------------------
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # --- logs ----------------------------------------------------------------
    access_log /data/data/com.termux/files/usr/var/log/nginx/php-hardening.access.log;
    error_log  /data/data/com.termux/files/usr/var/log/nginx/php-hardening.error.log warn;
    # Debian/Docker: /var/log/nginx/...
}
