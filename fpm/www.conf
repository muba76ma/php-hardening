; fpm/www.conf — php-fpm pool hardening
;
; Deploy targets:
;   Termux:   $PREFIX/etc/php-fpm.d/www.conf
;   Debian:   /etc/php/8.x/fpm/pool.d/www.conf
;   Docker:   /usr/local/etc/php-fpm.d/www.conf
;
; WARNING: php_admin_value / php_admin_flag cannot be overridden at runtime
; by ini_set(), ini_alter(), or .user.ini. This is the layer that makes the
; hardening in 99-hardening.ini NON-BYPASSABLE by application code.
;
; WARNING: user/group below must match the account that owns the web app
; files. On Termux, only the termux user exists — leave defaults.

[www]
; --- process identity ---
; Termux: leave commented (single-user environment, no root to create users)
; Debian: user = www-data | group = www-data
; Docker: user = www-data | group = www-data
;user = www-data
;group = www-data

; --- socket ---
listen = /data/data/com.termux/files/usr/var/run/php-fpm.sock
; Debian: listen = /run/php/php8.4-fpm.sock
; Docker: listen = 127.0.0.1:9000
listen.owner = termux
listen.group = termux
listen.mode = 0660

; --- environment isolation ---
clear_env = yes

; --- file execution restriction ---
security.limit_extensions = .php

; --- non-bypassable hardening (mirrors 99-hardening.ini) ---
php_admin_value[expose_php]              = off
php_admin_value[display_errors]          = off
php_admin_value[display_startup_errors]  = off
php_admin_value[log_errors]              = on
php_admin_value[allow_url_include]       = off
php_admin_value[allow_url_fopen]         = off
php_admin_value[session.upload_progress.enabled] = off
php_admin_value[session.cookie_httponly] = on
php_admin_value[session.use_strict_mode] = on
php_admin_value[session.use_only_cookies] = on
php_admin_value[fatal_error_backtraces]  = off

; --- function blocking (non-bypassable) ---
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,phpinfo,show_source,dl

; --- per-pool log ---
php_admin_value[error_log] = /data/data/com.termux/files/usr/var/log/php-fpm-www-error.log
php_admin_flag[log_errors] = on

; --- per-pool session isolation ---
; CRITICAL: without this, all apps share /tmp session files -> auth bypass
php_admin_value[session.save_path] = /data/data/com.termux/files/usr/var/lib/php/sessions
php_admin_value[session.gc_maxlifetime] = 1440
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor]     = 100

; --- filesystem restriction ---
; Set per-app. Comma-separated. Symlinks followed but resolved.
;php_admin_value[open_basedir] = /data/data/com.termux/files/home/path/to/app:/data/data/com.termux/files/usr/var/lib/php/sessions:/tmp

; --- process management ---
pm = dynamic
pm.max_children      = 5
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests      = 500

; --- request limits ---
request_terminate_timeout = 60s
request_slowlog_timeout   = 10s
slowlog = /data/data/com.termux/files/usr/var/log/php-fpm-www-slow.log
