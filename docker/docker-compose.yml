services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.fpm
    restart: unless-stopped
    volumes:
      - ../app:/var/www:ro
      - fpm-sock:/run/php
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/php/sessions
      - /var/lib/php/upload
      - /var/log/php
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add:  [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    networks: [web]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["8080:80"]
    volumes:
      - ../app:/var/www:ro
      - ../nginx/php-hardening.conf:/etc/nginx/conf.d/default.conf:ro
      - fpm-sock:/run/php:ro
    depends_on: [app]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    networks: [web]

volumes:
  fpm-sock:

networks:
  web: {}
