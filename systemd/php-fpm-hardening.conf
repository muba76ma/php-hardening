# Drop-in for php*-fpm.service:
#   sudo mkdir -p /etc/systemd/system/php8.4-fpm.service.d
#   sudo cp systemd/php-fpm-hardening.conf /etc/systemd/system/php8.4-fpm.service.d/hardening.conf
#   sudo systemctl daemon-reload && sudo systemctl restart php8.4-fpm
[Service]
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=yes
ReadWritePaths=/run/php /var/lib/php/sessions /var/lib/php/upload /var/log/php
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
LockPersonality=yes
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
# NOTE: MemoryDenyWriteExecute=yes breaks OPcache JIT — leave it off unless you
# disable JIT (opcache.jit=off) in php.ini.
