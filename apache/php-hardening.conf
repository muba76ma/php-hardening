# ---- MODE B: proxy_fcgi -> php-fpm (recommended) --------------------------
# Non-bypassable hardening is enforced by the fpm pool (fpm/www.conf).
# php_admin_value at Apache level does NOT apply to proxy_fcgi handlers.
<FilesMatch "\.php$">
    SetHandler "proxy:unix:/data/data/com.termux/files/usr/var/run/php-fpm.sock|fcgi://localhost"
    # Debian: SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    # Docker: SetHandler "proxy:unix:/run/php/php-fpm.sock|fcgi://localhost"
    # TCP:    SetHandler "proxy:fcgi://127.0.0.1:9000"
    Require all granted
</FilesMatch>

ProxyTimeout 60

# --- logs (adapt per deployment; commented Termux defaults) ---------------
#ErrorLog  /data/data/com.termux/files/usr/var/log/apache2/php-hardening.error.log
#CustomLog /data/data/com.termux/files/usr/var/log/apache2/php-hardening.access.log combined
