# apache/php-hardening.conf -- Apache 2.4 hardening for PHP apps
#
# Deploy targets:
#   Termux:  $PREFIX/etc/apache2/conf.d/php-hardening.conf  (via Include)
#   Debian:  /etc/apache2/conf-available/php-hardening.conf  (+ a2enconf php-hardening)
#   RHEL:    /etc/httpd/conf.d/php-hardening.conf
#   Docker:  /etc/apache2/conf-enabled/ or /etc/httpd/conf.d/
#
# Two integration modes -- pick ONE:
#
#   MODE A: mod_php (embedded, legacy)
#     - Simplest. PHP runs inside the Apache worker.
#     - No isolation between apps on the same Apache.
#     - Acceptable for single-app hosts only.
#
#   MODE B: proxy_fcgi -> php-fpm (recommended)
#     - Pool isolation, non-bypassable php_admin_value enforced by fpm pool.
#     - Requires mod_proxy + mod_proxy_fcgi + php-fpm running.
#     - What docker/Dockerfile.fpm builds.
#
# Enable required modules first:
#   Debian: a2enmod headers proxy proxy_fcgi setenvif
#   RHEL:   httpd -M | grep -E 'headers|proxy_fcgi'   (usually already loaded)
#   Termux: apachectl -M | grep -E 'headers|proxy_fcgi'

# --- global: tokens and methods ---------------------------------------------
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# --- global: header hygiene -------------------------------------------------
<IfModule mod_headers.c>
    Header always unset X-Powered-By
    Header always unset X-AspNet-Version
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    # HSTS -- enable only over HTTPS:
    # Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    # CSP -- test against your app before enabling:
    # Header always set Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'self'"
</IfModule>

# --- global: request body limit ---------------------------------------------
LimitRequestBody 8388608

# --- global: timeouts -------------------------------------------------------
TimeOut 60
KeepAliveTimeout 5

# --- global: base options ---------------------------------------------------
Options -Indexes -Includes -ExecCGI
AllowOverride None

# --- deny hidden, backup, source, VCS paths --------------------------------
<FilesMatch "(^\.|\.(bak|backup|old|orig|swp|swo|tmp|log|sql|sqlite|db|env|git|svn|hg|htaccess|htpasswd|ini|conf|sh|bash)$|composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|Dockerfile|docker-compose\.ya?ml|phpunit\.xml)">
    Require all denied
</FilesMatch>

# --- deny common tooling directories --------------------------------------
<DirectoryMatch "/\.(git|svn|hg)(/|$)">
    Require all denied
</DirectoryMatch>

# ============================================================================
# PHP integration -- pick ONE mode below, comment the other
# ============================================================================

